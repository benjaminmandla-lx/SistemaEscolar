{% extends 'base.html' %}

{% block title %}Cadastro de Aluno{% endblock %}

{% block content %}
    <div class="container">
		<div class="col-lg-6 offset-lg-3 col-sm-12">
			{% if resultado == 'email_existe' %}
				<div class="alert alert-danger alert-dismissible fade show"
					role="alert">
					E-mail já cadastrado. Tente novamente.
					<button type="button" class="btn-close" data-bs-dismiss="alert"
						aria-label="Close"></button>
				</div>
			{% endif %}
			
			<form action="{{url_for('salvar_usuario')}}" method="post" id="form1">
				<h1 class="text-center">Cadastre</h1>

				<div class="mb-2">
					<label for="nome">Nome completo*</label> 
					<input type="text"
						name="nome" id="nome" class="form-control" minlength="3"
						maxlength="50" required="required"> 
						<span id="0"></span>
				</div>

				<div class="mb-2">
					<label for="senha">Senha*</label> <input type="password"
						name="senha" id="senha" class="form-control" minlength="6"
						maxlength="12" required="required"> 
						<span id="2"></span>
				</div>

				<div class="mb-2">
    			<label for="tipo" class="form-label">Tipo de Usuário</label>

    			<input
        		type="text"
        		id="tipo"
        		class="form-control"
        		value="Aluno"
        		readonly>
    			<input type="hidden" name="tipo" value="ALUNO">
				</div>

				<div class="mb-2">
					<label for="data_nascimento">Data de Nascimento*</label> <input
						type="date" name="data_nascimento" id="data_nascimento"
						class="form-control" max="2012-12-31" required="required">
					<span id="4"></span>

				<div class="mb-2">
					<label for="turma">Turma</label> <select class="form-select"
						name="turma" id="turma" required="required">
					{% for turma in turmas %}
                    <option value="{{ turma.id }}">
                    {{ turma.nome_turma }}
                    </option>
                    {% endfor %}
					</select> 
				</div>

                <div class="mb-2" id="div_responsavel_legal" style="display:none;">
                <label for="responsavel_legal">
                            Possui responsável legal cadastrado por determinação judicial
                            (curatela, tutela ou medida equivalente)?
                </label>

                <select class="form-select" name="responsavel_legal" id="responsavel_legal">
                <option value="">Selecione</option>
                <option value="SIM">Sim</option>
                <option value="NAO">Não</option>
                </select>
                </div>

				<div class="mb-2">
					<button type="submit" class="btn btn-primary">
    				<i class="bi bi-check-circle"></i> Salvar</button>
				</div>
				<div class="mb-2">
					<a href="{{ url_for('home') }}" class="btn btn-secondary" id="link">Cancelar</a>
				</div>
			</form>
		</div>
	</div>
    <script>
    document.addEventListener("DOMContentLoaded", function () {

    const dataNascimento = document.getElementById("data_nascimento");
    const divResponsavel = document.getElementById("div_responsavel_legal");

    function verificarIdade() {

        if (!dataNascimento.value) {
            divResponsavel.style.display = "none";
            return;
        }

        const nascimento = new Date(dataNascimento.value);
        const hoje = new Date();

        let idade = hoje.getFullYear() - nascimento.getFullYear();

        const mes = hoje.getMonth() - nascimento.getMonth();

        if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
            idade--;
        }

        if (idade >= 18) {
            divResponsavel.style.display = "block";
        } else {
            divResponsavel.style.display = "none";
        }
    }

    dataNascimento.addEventListener("change", verificarIdade);
});
</script>
{% endblock %}
