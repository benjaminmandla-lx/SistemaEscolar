{% extends 'base.html' %}

{% block title %}Perfil do Usuário - iFitness{% endblock %}

{% block navbar %}
    {% include 'navbar.html' %}
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Meu Perfil</h2>
    <hr>

    <form action="{{ url_for('atualizar_perfil') }}" method="POST" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-4 text-center">
                <!-- Exibição da foto atual ou padrão -->
                <div class="mb-3">
                    <img src="{{ usuario.foto or 'SAN/static/img/default-user.png' }}" 
                         alt="Foto de Perfil" class="img-thumbnail" style="width: 200px;">
                </div>
                
                <div class="mb-3">
                    <label for="foto" class="form-label">Alterar Foto</label>
                    <input type="file" name="foto" id="foto" class="form-control" accept="image/*">
                </div>
            </div>

            <div class="col-md-8">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" name="nome" id="nome" class="form-control" 
                           value="{{ usuario.nome }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" name="email" id="email" class="form-control" 
                           value="{{ usuario.email }}" readonly>
                </div>
                <div class="mb-3">
                    <label for="prontuario" class="form-label">Prontuario</label>
                    <input type="email" name="email" id="email" class="form-control" 
                           value="{{ usuario.prontuario }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" id="data_nascimento" 
                           class="form-control" value="{{ usuario.data_nascimento }}">
                </div>

                <div class="mb-3">
                    <label for="genero" class="form-label">Gênero</label>
                    <select name="genero" id="genero" class="form-select">
                        <option value="Masculino" {% if usuario.genero == 'Masculino' %}selected{% endif %}>Masculino</option>
                        <option value="Feminino" {% if usuario.genero == 'Feminino' %}selected{% endif %}>Feminino</option>
                        <option value="Outro" {% if usuario.genero == 'Outro' %}selected{% endif %}>Outro</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
