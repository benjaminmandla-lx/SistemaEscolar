{% extends "base.html" %}

{% block title %}Página de Login{% endblock %}

{% block content %}

  	<div class="container">
		<div class="col-lg-4 offset-lg-4 col-sm-12">
			{% if resultado == 'cadastrado' %}
				<div class="alert alert-success alert-dismissible fade show"
					role="alert">
					Usuário cadastrado com sucesso. Faça o login.
					<button type="button" class="btn-close" data-bs-dismiss="alert"
						aria-label="Close"></button>
				</div>
			{% endif %}
			{% if resultado == 'falha' %}
				<div class="alert alert-danger alert-dismissible fade show"
					role="alert">
					Prontuário e/ou senha inválidos.
					<button type="button" class="btn-close" data-bs-dismiss="alert"
						aria-label="Close"></button>
				</div>
			{% endif %}

	  		<form action="{{url_for('autenticar')}}" method="post">
	  				<h1 class="text-center">Login</h1>
	  				
	  				<div class="input-group mb-3">
	  					<span class="input-group-text">
							<i class="bi bi-envelope"></i>
						</span>
	  					<input name="prontuario" id="prontuario"
	  						placeholder="Prontuário" required="required"
	  						class="form-control">
	  				</div>
	  				
	  				<div class="input-group mb-3">
	  					<span class="input-group-text">
	  						<i class="bi bi-file-lock"></i>
	  					</span>
	  					<input type="password" name="senha" id="senha"
	  						placeholder="Senha" required="required"
	  						class="form-control">
	  				</div>
	  				
	  				<div class="mb-3">
	  					<button type="submit" class="btn btn-primary" name="action" 
	  						value="login">Login</button>
	  				</div>
	  				
	  		</form>
  		</div>
  	</div>

{% endblock %}
